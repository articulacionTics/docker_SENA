# Solución multiservicio: proxy (Nginx) -> api (FastAPI) -> db (PostgreSQL)
# Uso:  cp .env.example .env  &&  docker compose up -d --build
# Solo el proxy publica un puerto en el host; api y db quedan aisladas en "interna".

name: docker-sena

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
    # Parámetros de bajo consumo para equipos pequeños (guía AA2, paso 5)
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    volumes:
      # PostgreSQL 18+: el volumen va en /var/lib/postgresql (los datos quedan en
      # /var/lib/postgresql/18/docker). Montarlo en /var/lib/postgresql/data hace
      # fallar el contenedor: ver docs/imagenes.md §4.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    networks: [interna]
    # SIN "ports": la base de datos no es accesible desde el host.

  api:
    build: .
    image: api-app:1.0.0
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    networks: [interna]
    # SIN "ports": la API solo se alcanza a través del proxy.

  proxy:
    image: nginx:1.30-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped
    networks: [interna]

volumes:
  pgdata:

networks:
  interna:
    driver: bridge
