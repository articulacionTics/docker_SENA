<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="820" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">docker-multiservice-lab — Arquitectura de despliegue</text>
  <text x="500" y="70" text-anchor="middle" font-size="15" fill="#475569">Docker Engine sobre Ubuntu (WSL2) · Docker Compose v2</text>

  <!-- Cliente -->
  <rect x="360" y="95" width="280" height="56" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="500" y="129" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Cliente (navegador / curl)</text>

  <!-- Host boundary -->
  <rect x="150" y="190" width="700" height="600" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="170" y="216" font-size="15" font-weight="600" fill="#475569">Host Docker (Docker Engine)</text>

  <!-- Published port -->
  <line x1="500" y1="151" x2="500" y2="268" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="512" y="176" width="236" height="30" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="630" y="197" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">puerto externo: 8080 → 80</text>

  <!-- Network -->
  <rect x="210" y="240" width="580" height="420" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="266" font-size="16" font-weight="700" fill="#1d4ed8">red: interna (bridge)</text>

  <!-- Nginx -->
  <rect x="360" y="272" width="280" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="302" text-anchor="middle" font-size="19" font-weight="700" fill="#14532d">proxy · Nginx :80</text>
  <text x="500" y="326" text-anchor="middle" font-size="14" fill="#166534">nginx:1.30-alpine · reverse proxy</text>
  <text x="500" y="344" text-anchor="middle" font-size="13" fill="#166534">único servicio con ports</text>

  <line x1="500" y1="352" x2="500" y2="412" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="512" y="388" font-size="14" fill="#334155">HTTP → http://api:8000</text>

  <!-- API -->
  <rect x="360" y="414" width="280" height="80" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="500" y="444" text-anchor="middle" font-size="19" font-weight="700" fill="#312e81">api · FastAPI :8000</text>
  <text x="500" y="468" text-anchor="middle" font-size="14" fill="#3730a3">imagen propia (python:3.14-slim)</text>
  <text x="500" y="486" text-anchor="middle" font-size="13" fill="#3730a3">USER appuser (UID 1001) · sin ports</text>

  <line x1="500" y1="494" x2="500" y2="554" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="512" y="530" font-size="14" fill="#334155">PostgreSQL → db:5432</text>

  <!-- DB -->
  <rect x="360" y="556" width="280" height="80" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="500" y="586" text-anchor="middle" font-size="19" font-weight="700" fill="#831843">db · PostgreSQL :5432</text>
  <text x="500" y="610" text-anchor="middle" font-size="14" fill="#9d174d">postgres:18-alpine · healthcheck</text>
  <text x="500" y="628" text-anchor="middle" font-size="13" fill="#9d174d">sin ports</text>

  <!-- Volume -->
  <line x1="500" y1="636" x2="500" y2="694" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M410,704 a90,14 0 0,0 180,0 v46 a90,14 0 0,1 -180,0 z" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <ellipse cx="500" cy="704" rx="90" ry="14" fill="#fef08a" stroke="#a16207" stroke-width="2"/>
  <text x="500" y="740" text-anchor="middle" font-size="17" font-weight="700" fill="#713f12">volumen pgdata</text>
  <text x="610" y="736" font-size="13" fill="#713f12">/var/lib/postgresql/data</text>

  <!-- Blocked ports legend -->
  <g font-size="14" fill="#991b1b">
    <text x="660" y="460">✕ host:8000 no publicado</text>
    <text x="660" y="602">✕ host:5432 no publicado</text>
  </g>
</svg>
